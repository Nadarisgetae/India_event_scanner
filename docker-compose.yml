version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: india-event-scanner-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SQLITE_PATH=/app/storage/event_scanner.db
      - STORAGE_DIR=/app/storage
      - DEFAULT_MODEL=meta-llama/llama-3.3-70b-instruct:free
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./india-event-impact-mock
      dockerfile: Dockerfile
    container_name: india-event-scanner-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
